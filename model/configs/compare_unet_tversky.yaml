extends: comparison_base.yaml
experiment: {variant: tversky}
training:
  checkpoint_dir: checkpoints/comparison/unet_tversky
  loss_function: tversky_ce
  loss_params: {tversky_weight: 0.5, ce_weight: 0.5, fp_weight: 0.7, fn_weight: 0.3}
inference:
  model_path: checkpoints/comparison/unet_tversky/best_model.pt
  output_dir: predictions/comparison/unet_tversky
logging: {log_dir: logs/comparison/unet_tversky}
