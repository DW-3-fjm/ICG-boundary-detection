# Conservative first-run profile for the 12 GiB RTX 5070 Ti Laptop GPU.
# Channel semantics must be confirmed against actual images before training.
data:
  train_data_dir: "data/train"
  val_data_dir: "data/val"
  test_data_dir: "data/test"
  image_size: [256, 256]
  in_channels: 1
  out_channels: 2
  annotation: "Confirm foreground semantics with the clinical lead"
  batch_size: 8
  # Start with 0 on Windows; benchmark 2 or 4 after validating file loading.
  num_workers: 0
  pin_memory: true
  augmentations:
    horizontal_flip: 0.5
    vertical_flip: 0.0
    rotation: 10
    brightness: 0.1
    contrast: 0.1
    gaussian_noise: 0.01
model:
  name: "unet"
  in_channels: 1
  out_channels: 2
  base_filters: 32
  depth: 4
  dropout: 0.1
  use_batchnorm: true
training:
  epochs: 100
  seed: 42
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  optimizer: "adamw"
  scheduler: "cosine_annealing"
  scheduler_params:
    T_max: 100
    eta_min: 1.0e-6
  loss_function: "dice_ce"
  loss_params:
    dice_weight: 0.5
    ce_weight: 0.5
  gradient_clip: 1.0
  mixed_precision: true
  early_stopping:
    patience: 15
    min_delta: 1.0e-4
  checkpoint_dir: "checkpoints/laptop_baseline"
  save_top_k: 2
  monitor_metric: "val_dice"
  monitor_mode: "max"
inference:
  model_path: "checkpoints/laptop_baseline/best_model.pt"
  output_dir: "predictions/laptop_baseline"
  save_overlay: true
  overlay_alpha: 0.5
  min_contour_area: 100
  min_mean_probability: 0.55
tracking:
  enabled: true
  num_points: 100
evaluation:
  metrics: ["dice", "iou", "precision", "recall", "hausdorff", "hausdorff_95", "surface_distance"]
logging:
  level: "INFO"
  log_dir: "logs/laptop_baseline"
  use_tensorboard: true
device:
  use_cuda: true
  device_id: 0
